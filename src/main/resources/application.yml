spring:
  application:
    name: catalog-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: catalog_user
    password: catalog_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.catalogcollector: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-this-must-be-at-least-256-bits-long!!}
    expiration-ms: 86400000
  providers:
    open-library:
      base-url: https://openlibrary.org
    google-books:
      base-url: https://www.googleapis.com
      api-key: ${GOOGLE_BOOKS_API_KEY:}
    upc-item-db:
      base-url: https://api.upcitemdb.com
    best-buy:
      base-url: https://api.bestbuy.com
      api-key: ${BEST_BUY_API_KEY:}
    music-brainz:
      base-url: https://musicbrainz.org
      contact-email: ${MUSICBRAINZ_CONTACT_EMAIL:}
    ebay-browse:
      base-url: ${EBAY_BASE_URL:https://api.sandbox.ebay.com}
      token-url: ${EBAY_TOKEN_URL:https://api.sandbox.ebay.com/identity/v1/oauth2/token}
      client-id: ${EBAY_CLIENT_ID:}
      client-secret: ${EBAY_CLIENT_SECRET:}
    tmdb:
      base-url: https://api.themoviedb.org
      api-key: ${TMDB_API_KEY:}
    igdb:
      base-url: https://api.igdb.com
      twitch-token-url: https://id.twitch.tv/oauth2/token
      client-id: ${TWITCH_CLIENT_ID:}
      client-secret: ${TWITCH_CLIENT_SECRET:}
    ani-list:
      base-url: https://graphql.anilist.co

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_test_db
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false

logging:
  level:
    root: WARN
    com.catalogcollector: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 50
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.catalogcollector: INFO
  pattern:
    console: "%d{ISO8601} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET}
